<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Habit Builder">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#10221d"/>
      <stop offset=".55" stop-color="#0c1513"/>
      <stop offset="1" stop-color="#090c0c"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#29ffb9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#29ffb9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fffdc"/>
      <stop offset="1" stop-color="#29ffb9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <!-- volledig bleed; alle inhoud blijft binnen de "safe zone" van maskable iconen (cirkel met straal 40%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#aura)"/>
  <g transform="rotate(-90 256 256)" fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="138" stroke="#ffffff" stroke-opacity=".10" stroke-width="30"/>
    <circle cx="256" cy="256" r="138" stroke="#29ffb9" stroke-width="30" stroke-dasharray="650 867" filter="url(#glow)" opacity=".7"/>
    <circle cx="256" cy="256" r="138" stroke="url(#mint)" stroke-width="30" stroke-dasharray="650 867"/>
  </g>
  <path d="M200 262l41 42 75-88" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M350 112C388 108 402 134 400 160C368 162 348 142 350 112Z" fill="url(#mint)"/>
</svg>
