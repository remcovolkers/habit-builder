<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Iconen: prestaties per habit en uitbouwen</title></head><body>
<!-- Met de hand getekend (2026-11-09), in de stijl van de Moda-set (lijn 1,75, accent voor het onderscheid). Bron voor npm run icons:build. -->
<!-- één tegel (een habit) met een vinkje: 10 keer -->
<svg id="icon-ach-habit-done-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect><path stroke="var(--icon-accent, currentColor)" d="M9.14 11.61l2.2 2.2 3.74-4.18"></path></svg>
<!-- twee tegels, voorop een vinkje: 25 keer -->
<svg id="icon-ach-habit-done-25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="2.5"></rect><rect x="8" y="8" width="13" height="13" rx="2.5"></rect><path stroke="var(--icon-accent, currentColor)" d="M11.9 13.6l2 2 3.4-3.8"></path></svg>
<!-- drie tegels achter elkaar, voorop een vinkje: 50 keer -->
<svg id="icon-ach-habit-done-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="10" height="10" rx="2.5"></rect><rect x="7" y="7" width="11" height="11" rx="2.5"></rect><rect x="11.5" y="11.5" width="10" height="10" rx="2.5"></rect><path stroke="var(--icon-accent, currentColor)" d="M14.42 15.58l1.6 1.6 2.72-3.04"></path></svg>
<!-- een stapel tegels met een vonk: 100 keer -->
<svg id="icon-ach-habit-done-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="10" height="10" rx="2.5"></rect><rect x="7" y="8.5" width="10" height="10" rx="2.5"></rect><rect x="11.5" y="12.5" width="9" height="9" rx="2.5"></rect><path stroke="var(--icon-accent, currentColor)" fill="var(--icon-accent, currentColor)" fill-opacity="0.3" d="M19.5 2.2Q19.5 4 21.3 4Q19.5 4 19.5 5.8Q19.5 4 17.7 4Q19.5 4 19.5 2.2Z"></path><path stroke="var(--icon-accent, currentColor)" d="M14.18 17.07l1.4 1.4 2.38-2.6599999999999997"></path></svg>
<!-- de eerste trede met een pijl omhoog -->
<svg id="icon-ach-build-first-step" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h7v-6h9"></path><path stroke="var(--icon-accent, currentColor)" d="M16 9V4M13.5 6.5L16 4l2.5 2.5"></path></svg>
<!-- drie treden omhoog met een vonk -->
<svg id="icon-ach-build-steps-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h5v-4.5h5V11h5V6.5h3"></path><path stroke="var(--icon-accent, currentColor)" fill="var(--icon-accent, currentColor)" fill-opacity="0.3" d="M20.5 1.7000000000000002Q20.5 3.2 22 3.2Q20.5 3.2 20.5 4.7Q20.5 3.2 19 3.2Q20.5 3.2 20.5 1.7000000000000002Z"></path></svg>
<!-- treden met een vlag op de top: uitgebouwd -->
<svg id="icon-ach-built-goal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h5v-4.5h5V11h4"></path><path stroke="var(--icon-accent, currentColor)" d="M18 11V3.5"></path><path stroke="var(--icon-accent, currentColor)" fill="var(--icon-accent, currentColor)" fill-opacity="0.3" d="M18 3.5h4l-1.4 2L22 7.5h-4z"></path></svg>
<!-- een rondje terug en weer verder: terug is ook vooruit -->
<svg id="icon-ach-build-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path stroke="var(--icon-accent, currentColor)" d="M20 4v4.2h-4.2"></path></svg>
</body></html>
