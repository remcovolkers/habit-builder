<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Iconen: knoppen op Vandaag</title></head><body>
<!-- Met de hand getekend (2026-11-05), in de stijl van de Moda-set en van ui-all-planned: dezelfde kalender, lijn 1,75, het accent doet het onderscheid. Bron voor npm run icons:build. -->
<!-- "Iets inplannen": een kalender met een plus in een accentcirkel -->
<svg id="icon-ui-plan-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><circle cx="12" cy="15.5" r="3.4" stroke="var(--icon-accent, currentColor)" fill="var(--icon-accent, currentColor)" fill-opacity="0.3"></circle><path stroke="var(--icon-accent, currentColor)" d="M12 13.9v3.2M10.4 15.5h3.2"></path></svg>
<!-- "Deze dag niet meetellen": dezelfde kalender, maar de dag is een gestreepte ring: leeg, zonder oordeel -->
<svg id="icon-ui-day-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><circle cx="12" cy="15.5" r="3.4" stroke="var(--icon-accent, currentColor)" stroke-dasharray="1 3.27"></circle></svg>
</body></html>
